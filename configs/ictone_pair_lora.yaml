flux_path: "ckpt/FLUX-Fill"
dtype: "bfloat16"

model:
  union_cond_attn: true
  add_cond_attn: false
  latent_lora: false
  use_sep: false

train:
  batch_size: 1
  accumulate_grad_batches: 4
  dataloader_workers: 2
  save_interval: 500
  sample_interval: 500
  max_steps: 20000
  gradient_checkpointing: true
  save_path: "runs"
  keep_last_k: 5

  # Warm-start LoRA weights from a prior checkpoint (weights only; fresh
  # optimizer/scheduler/step counter). Path may point at either the directory
  # containing ``pytorch_lora_weights.safetensors`` or the .safetensors file
  # itself. ``null`` (the default) means from-scratch LoRA init.
  # The lora_config below (rank / target_modules) must match the checkpoint.
  # Prefer overriding from the launch script via ``XFL_LORA_PATH`` env var
  # (see train_ictone_pair_local.sh) rather than editing this file.
  lora_path: null

  condition_type: "ictone"
  dataset:
    type: "ictone_triplet"
    # Pre-built (content, reference, gt) triples in JSON list-of-dicts form
    # (produced from TST100K). Paths in each entry are relative to
    # ``data_root``. Reference and GT are used verbatim; the content branch
    # still receives a multi-LUT degradation chain (K LUTs, K in
    # [content_k_min, content_k_max]).
    triplet_json: data/TST100K/triplet.json
    data_root:    data/TST100K
    # LUT pool for the content-degradation chain: 20 diverse .cube files
    # committed under data/content_lut/ (one path per line in list.txt).
    content_lut_list_path: data/content_lut/list.txt
    condition_size: 512
    target_size: 512
    drop_text_prob: 0.1
    repeats: 1
    # Content chain length K ∈ [content_k_min, content_k_max]; each row
    # applies exactly K random LUTs (K=0 → identity content).
    content_k_min: 0
    content_k_max: 2
    cache_luts: true

  ictone_val_dir: data/TST2K
  ictone_val_num: 8
  ictone_val_inference_steps: 4
  ictone_val_guidance_scale: 50.0
  ictone_val_seed: 666

  wandb:
    project: "ICTone"

  lora_config:
    r: 256
    lora_alpha: 256
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: "AdamW"
    params:
      lr: 1.0e-4
      betas: [0.9, 0.999]
      eps: 1.0e-8
      weight_decay: 0.01
